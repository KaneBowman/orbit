<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090e">
  <title>404 — 轨道暂时偏移 · Orbit</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2");
      font-weight: 300 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(ellipse 60% 60% at 50% 30%, rgba(55, 170, 130, .16), transparent 70%),
        #07080c;
      color: #f5f7f4;
      font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .grid {
      position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 50%, #000, transparent 72%);
    }
    .card { position: relative; max-width: 520px; padding: 48px 32px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 28px;
      display: grid; place-items: center;
      border: 1px solid rgba(147,243,200,.22); border-radius: 18px;
      background: rgba(147,243,200,.06);
      box-shadow: 0 0 60px rgba(78,220,162,.12);
    }
    .mark svg { width: 44px; height: 44px; fill: none; stroke: #93f3c8; stroke-width: 1.2; }
    .mark svg circle:last-child { fill: #93f3c8; stroke: none; }
    .code {
      font-family: "JetBrains Mono", Consolas, monospace;
      color: #93f3c8; font-size: 12px; letter-spacing: .18em;
    }
    h1 {
      margin: 16px 0 0;
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      font-weight: 500; line-height: 1.1; letter-spacing: -.05em;
    }
    p { margin: 18px auto 0; max-width: 400px; color: #929cac; font-size: 14px; line-height: 1.9; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 30px; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0 22px; border-radius: 10px;
      color: #05130d; text-decoration: none; font-size: 14px; font-weight: 500;
      background: linear-gradient(180deg, #b9ffe1, #7de9bb);
      box-shadow: 0 10px 30px rgba(78,220,162,.14);
    }
    a.secondary {
      color: #dce4ef; background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.13); box-shadow: none;
    }
    a:hover { transform: translateY(-1px); }
    .tiny { margin-top: 34px; color: #586273; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .06em; }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8.5"/><ellipse cx="16" cy="16" rx="14" ry="5.6" transform="rotate(-28 16 16)"/><circle cx="26.4" cy="10.4" r="2.2"/></svg>
    </div>
    <div class="code">ERROR 404 · LOST IN ORBIT</div>
    <h1>这条轨道不存在。</h1>
    <p>页面可能已经漂移到了别处。回到 Orbit，继续整理你的想法。</p>
    <div class="actions">
      <a href="/orbit/">回到首页</a>
      <a class="secondary" href="https://github.com/KaneBowman/orbit">访问 GitHub</a>
    </div>
    <div class="tiny">ORBIT · OPEN SOURCE KNOWLEDGE WORKSPACE</div>
  </main>
</body>
</html>
